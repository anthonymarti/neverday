name: Neverday prototype verification
on:
  push:
    branches: [connectivity-prototype]
    paths: ['prototype/**', '!prototype/docs/**', '!prototype/README.md', '!prototype/neverday-demo.html', '.github/workflows/neverday-prototype.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax, domain tests and static build
        working-directory: prototype
        run: |
          npm run lint
          npm test
          npm run build
      - name: Install temporary browser tooling without cache
        run: |
          npm install --prefix /tmp/neverday-browser playwright@1.56.1 --no-audit --no-fund
          /tmp/neverday-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Browser journey and desktop/mobile screenshots in logs
        working-directory: prototype
        run: |
          node tests/browser.mjs
          NEVERDAY_TEST_BASE="file://$GITHUB_WORKSPACE/prototype/neverday-demo.html" node tests/browser.mjs
      - name: Inspect final provider and free hosting terms
        if: always()
        working-directory: prototype
        run: node scripts/source-browser.mjs
